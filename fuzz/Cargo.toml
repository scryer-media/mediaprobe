[package]
name = "mediaprobe-fuzz"
version = "0.0.0"
edition = "2024"
rust-version = "1.97.1"
license = "Apache-2.0"
publish = false
description = "cargo-fuzz targets, structure-aware mutators and the fuzz harness for mediaprobe."

[package.metadata]
cargo-fuzz = true

# Its own workspace and lockfile, like xtask: nothing here reaches the
# published crate's dependency graph.
[workspace]

[lib]
name = "mediaprobe_fuzz"
path = "src/lib.rs"

[dependencies]
libfuzzer-sys = "0.4.13"
# The `fuzzing` feature exposes the internals the SIMD differential needs.
mediaprobe = { path = "..", features = ["fuzzing"] }
serde = "1"
serde_json = "1"

[lints.rust]
unsafe_code = "forbid"

# Every target links the same harness; optimise it like the targets.
[profile.release]
debug = 1

[[bin]]
name = "container_mkv"
path = "fuzz_targets/container_mkv.rs"
test = false
doc = false
bench = false

