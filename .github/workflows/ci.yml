name: ci

# fmt, clippy, tests on every desktop platform, docs, MSRV and packaging.
# `ci-complete` is the one required check: it fails unless every lane, the
# `hygiene` checks on the tree among them, succeeded.

on:
  pull_request:
  workflow_dispatch:
  push:
    branches:
      - main

concurrency:
  group: mediaprobe-ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  # Whether a fixture corpus revision is pinned. Until the first one is
  # published from main, test-corpus/lock.json names no manifest and the
  # lanes that hydrate fixtures cannot run; they are skipped, and the
  # completion gate allows exactly those skips and no others.
  corpus:
    name: corpus-state
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    outputs:
      published: ${{ steps.state.outputs.published }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Is a corpus revision pinned
        id: state
        run: |
          set -eu
          if jq -e '.manifest != null' test-corpus/lock.json > /dev/null; then
            echo "published=true" >> "$GITHUB_OUTPUT"
          else
            echo "published=false" >> "$GITHUB_OUTPUT"
            echo "::warning::no fixture corpus is published; the lanes that need it are skipped"
          fi

  # The repository carries no binaries, no personal paths and no
  # credentials. The pre-commit hook checks staged changes on a
  # contributor's machine; this checks the tree whatever the hook saw.
  hygiene:
    name: hygiene
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: No binary files
        run: |
          set -eu
          # Whatever Git counts as binary, by content rather than extension,
          # so a renamed archive is caught too.
          empty="$(git hash-object -t tree /dev/null)"
          binary="$(git diff --numstat "$empty" HEAD | awk '$1 == "-" { print $3 }')"
          if [ -n "$binary" ]; then
            echo "binary files are generated, never committed:" >&2
            echo "$binary" >&2
            exit 1
          fi
      - name: No personal home paths
        run: |
          set -eu
          # A home path names its account; only the conventional placeholders
          # may appear (the same list the pre-commit hook accepts). The
          # bracketed letters keep this file from matching itself.
          found="$(git grep -nIE '(/U[s]ers/|/h[o]me/|[Cc]:[\\/][Uu]sers[\\/])[A-Za-z0-9._-]+' \
            | grep -vE '(/U[s]ers/|/h[o]me/|[Cc]:[\\/][Uu]sers[\\/])(example|user|username|youruser|your-user|someuser|testuser|test-user|alice|bob|runner)([^A-Za-z0-9._-]|$)' || true)"
          if [ -n "$found" ]; then
            echo "personal paths are not committed:" >&2
            echo "$found" >&2
            exit 1
          fi
      - name: No credentials
        run: |
          set -eu
          # Token shapes with a fixed prefix: private keys, GitHub, AWS,
          # Slack, crates.io and OpenAI-style keys.
          found="$(git grep -nIE -- '-----BEGIN ([A-Z]+ )?PRIVATE KEY-----|gh[pousr]_[A-Za-z0-9]{36}|github_pat_[A-Za-z0-9_]{40,}|AKIA[0-9A-Z]{16}|xox[abprs]-[A-Za-z0-9-]{10,}|cio[A-Za-z0-9]{32}|sk-[A-Za-z0-9]{32,}' || true)"
          if [ -n "$found" ]; then
            echo "credential-shaped strings are not committed:" >&2
            echo "$found" | cut -c1-80 >&2
            exit 1
          fi

  fmt:
    name: fmt
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: rustfmt
      - run: cargo fmt --all --check

  clippy:
    needs: [corpus]
    if: needs.corpus.outputs.published == 'true'
    name: clippy-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-26.04
          - platform: linux-aarch64
            runner: ubuntu-26.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: windows-x86_64
            runner: windows-2025
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      # The parser's unit tests embed fixtures with include_bytes!, so the
      # test targets do not compile until the pinned corpus is in place.
      - name: Hydrate the unit corpus
        run: cargo xtask test-corpus hydrate --profile unit
      - name: All features
        run: cargo clippy --locked --workspace --all-targets --all-features -- -D warnings
      - name: Default features
        run: cargo clippy --locked --all-targets -- -D warnings

  docs:
    name: docs
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      RUSTDOCFLAGS: -D warnings
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - run: cargo doc --locked --no-deps --all-features

  test:
    needs: [corpus]
    if: needs.corpus.outputs.published == 'true'
    name: test-${{ matrix.platform }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux-x86_64
            runner: ubuntu-26.04
          - platform: linux-aarch64
            runner: ubuntu-26.04-arm
          - platform: macos-aarch64
            runner: macos-15
          - platform: macos-x86_64
            runner: macos-15-intel
          - platform: windows-x86_64
            runner: windows-2025
          - platform: windows-aarch64
            runner: windows-11-arm
          # The same tests with the SIMD scanners switched off, so the scalar
          # fallbacks every other lane bypasses on a capable CPU are run too.
          - platform: linux-x86_64-scalar
            runner: ubuntu-26.04
            accel: "off"
    env:
      SCRYER_MEDIAINFO_ACCEL: ${{ matrix.accel || 'auto' }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      # The parser's unit tests embed fixtures with include_bytes!, so the
      # test targets do not compile until the pinned corpus is in place.
      - name: Hydrate the unit corpus
        run: cargo xtask test-corpus hydrate --profile unit
      # Nextest runs every test in its own process, so one test's crash or
      # leaked state cannot hide another's result. It does not run doctests;
      # `cargo test --doc` does, for each feature set.
      - name: Test all features
        run: cargo nextest run --locked --workspace --all-features --no-fail-fast
      - name: Doctests, all features
        run: cargo test --doc --locked --workspace --all-features --no-fail-fast
      - name: Test default features
        run: cargo nextest run --locked --no-fail-fast
      - name: Doctests, default features
        run: cargo test --doc --locked --no-fail-fast

  # The crate with the parser switched off: the result types and serde
  # alone. Needs no corpus, since every embedded fixture is behind `probe`.
  no-default-features:
    name: no-default-features
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Build
        run: cargo build --locked --no-default-features
      - name: Lints
        run: cargo clippy --locked --no-default-features --all-targets -- -D warnings
      - name: Only serde in the dependency graph
        run: |
          set -eu
          deps="$(cargo tree --locked --no-default-features -e normal --prefix none --format '{p}' | awk '{print $1}' | sort -u | grep -vxE 'mediaprobe|serde|serde_core|serde_derive|proc-macro2|quote|syn|unicode-ident' || true)"
          if [ -n "$deps" ]; then
            echo "the parser-free build pulls in more than serde:" >&2
            echo "$deps" >&2
            exit 1
          fi
      - name: Tests
        run: cargo nextest run --locked --no-default-features --no-fail-fast
      - name: Doctests
        run: cargo test --doc --locked --no-default-features --no-fail-fast

  msrv:
    name: msrv
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Read rust-version from the crate manifest
        id: msrv
        run: |
          version="$(sed -n 's/^rust-version = "\(.*\)"/\1/p' Cargo.toml | head -n1)"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "MSRV=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ steps.msrv.outputs.version }}
      - name: The crate
        run: cargo "+$MSRV" check --locked --all-features

  package:
    name: package
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: The crates.io archive builds
        run: cargo package --locked -p mediaprobe

  # The fixture corpus's configuration, which needs no fixtures: the
  # expectations and the ledger render from the recipes unchanged, every
  # profile resolves, and the tooling's own tests pass. The corpus itself is
  # generated and published by test-corpus-publish.yml, never committed.
  corpus-config:
    name: corpus-config
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Expectations and ledger match the recipes
        run: |
          set -eu
          cargo xtask test-corpus expectations --check
          cargo xtask test-corpus ledger --check
          cargo xtask test-corpus verify
      - name: Tooling format and lints
        run: |
          set -eu
          cargo fmt --manifest-path xtask/Cargo.toml --all --check
          cargo clippy --locked --manifest-path xtask/Cargo.toml --all-targets -- -D warnings
      - name: Tooling tests
        run: cargo nextest run --locked --manifest-path xtask/Cargo.toml --no-fail-fast

  # The fuzz harness on stable: its input builders and structure mutators
  # are tested, every target body runs over built inputs, and every recorded
  # regression replays through the parser (and fails while its finding is
  # open). The fuzzing itself runs in assurance.yml, fuzz-extended.yml,
  # release-fuzz.yml and the ClusterFuzzLite workflows.
  fuzz-harness:
    name: fuzz-harness
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
          components: clippy, rustfmt
      - uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-nextest@0.9.143
      - name: Format and lints
        run: |
          set -eu
          cargo fmt --manifest-path fuzz/Cargo.toml --all --check
          cargo clippy --locked --manifest-path fuzz/Cargo.toml --all-targets -- -D warnings
      - name: Tests
        run: cargo nextest run --locked --manifest-path fuzz/Cargo.toml --no-fail-fast

  ci-complete:
    name: ci-complete
    if: always()
    needs: [corpus, hygiene, fmt, clippy, docs, test, no-default-features, msrv, package, corpus-config, fuzz-harness]
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      # Every lane must have succeeded. The one exception: while no fixture
      # corpus is published, the lanes that need it are skipped.
      - name: Require every lane to have succeeded
        env:
          RESULTS: ${{ toJSON(needs) }}
          CORPUS_LANES: clippy test
        run: |
          set -eu
          failed="$(printf '%s' "$RESULTS" | jq -r --arg lanes "$CORPUS_LANES" '
            (.corpus.outputs.published == "false") as $absent
            | ($lanes | split(" ")) as $corpus
            | to_entries[]
            | select(.value.result != "success"
                and ((.value.result == "skipped" and $absent and (.key as $k | $corpus | index($k))) | not))
            | "\(.key): \(.value.result)"')"
          if [ -n "$failed" ]; then
            echo "lanes that did not succeed:" >&2
            echo "$failed" >&2
            exit 1
          fi
