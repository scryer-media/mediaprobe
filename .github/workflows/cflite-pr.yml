name: cflite-pr

# ClusterFuzzLite on pull requests: the targets a change can reach, under
# AddressSanitizer, for ten minutes shared across them. The deep search is
# cflite-batch.yml's.
#
# Switched off until the fixture corpus is first published: the fuzzers are
# seeded from it. To switch on, uncomment the pull_request trigger
# (docs/testing.md, "Switching on").

on:
  workflow_dispatch:
  # pull_request:
  #   paths:
  #     - 'src/**'
  #     - 'Cargo.toml'
  #     - 'Cargo.lock'
  #     - 'fuzz/**'
  #     - '.clusterfuzzlite/**'
  #     - 'test-corpus/lock.json'
  #     - '.github/workflows/cflite-pr.yml'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  pr-fuzzing:
    name: pr (address)
    runs-on: ubuntu-26.04
    timeout-minutes: 45
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: true
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}

      # Seeds from the pinned fixture corpus, read over HTTPS from the public
      # URL in test-corpus/lock.json; no credentials.
      - name: Seed the fuzz corpora
        run: |
          set -eu
          cargo xtask test-corpus hydrate --profile fuzz-seeds
          fuzz/scripts/seed-corpora.sh

      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust

      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: code-change
          sanitizer: address
