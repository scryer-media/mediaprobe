name: cflite-batch

# ClusterFuzzLite batch fuzzing: every target, two hours shared, nightly,
# under AddressSanitizer, with the corpus each night grows carried to the
# next. Then a coverage report and a corpus prune.
#
# AddressSanitizer is the one sanitizer: the parser is Rust, and Rust has no
# UndefinedBehaviorSanitizer. Integer overflow is caught by building with
# debug assertions (`cargo fuzz build -O -a` in .clusterfuzzlite/build.sh).
# Timeouts are reported (REPORT_TIMEOUTS), since a parser that hangs on an
# input is a finding.
#
# Switched off until the fixture corpus is first published: the fuzzers are
# seeded from it. To switch on, uncomment the schedule trigger
# (docs/testing.md, "Switching on").

on:
  workflow_dispatch:
    inputs:
      fuzz-seconds:
        description: 'Total fuzzing budget, in seconds'
        required: false
        default: '7200'
        type: string
  # schedule:
  #   - cron: '37 4 * * *'

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  batch-fuzzing:
    name: batch (address)
    runs-on: ubuntu-26.04
    # The budget is fuzzing time; the sanitizer build comes first, and a job
    # killed at its timeout loses the corpus it grew.
    timeout-minutes: 180
    concurrency:
      group: ${{ github.workflow }}-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - name: Seed the fuzz corpora
        run: |
          set -eu
          cargo xtask test-corpus hydrate --profile fuzz-seeds
          fuzz/scripts/seed-corpora.sh
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
      - name: Run fuzzers
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: ${{ inputs.fuzz-seconds || 7200 }}
          mode: batch
          sanitizer: address
        env:
          REPORT_TIMEOUTS: 'true'
      - name: Keep the reproducers
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: cflite-batch-findings
          path: out/artifacts
          if-no-files-found: ignore

  coverage:
    name: coverage
    runs-on: ubuntu-26.04
    timeout-minutes: 60
    needs: [batch-fuzzing]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
          sanitizer: coverage
      - name: Report coverage
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 600
          mode: coverage
          sanitizer: coverage

  prune:
    name: prune corpus
    runs-on: ubuntu-26.04
    timeout-minutes: 90
    needs: [coverage]
    if: ${{ !cancelled() }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Build fuzzers
        uses: google/clusterfuzzlite/actions/build_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          language: rust
      - name: Prune
        uses: google/clusterfuzzlite/actions/run_fuzzers@884713a6c30a92e5e8544c39945cd7cb630abcd1 # v1
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          fuzz-seconds: 3600
          mode: prune
