name: test-corpus-publish

# Generates one revision of the fixture corpus, signs its manifest and
# uploads it, content-addressed, to the corpus bucket. Manual and main-only:
# this is the one workflow that holds the bucket's write credentials, and
# running it is an operator decision. It never commits: the run uploads the
# updated test-corpus/lock.json and test-corpus/sources.json as an artifact,
# and pinning them is a reviewed pull request.
#
#   guard ─► publish
#
# `guard` holds no secrets. It refuses unless the run is on main and the
# operator typed the confirmation. `publish` needs it, so the credentials are
# never in a job that has not passed it. See docs/test-corpus.md.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "publish" to publish a corpus revision from main'
        required: true
        type: string
      dry_run:
        description: 'Generate, verify, build and sign, but upload nothing'
        required: false
        type: boolean
        default: false

concurrency:
  group: test-corpus-publish
  cancel-in-progress: false

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_TOOLCHAIN: 1.97.1

jobs:
  guard:
    name: guard
    runs-on: ubuntu-26.04
    timeout-minutes: 5
    steps:
      - name: Main and confirmed
        env:
          REF: ${{ github.ref }}
          CONFIRM: ${{ inputs.confirm }}
        run: |
          set -eu
          if [ "$REF" != "refs/heads/main" ]; then
            echo "the corpus is published from main only, not $REF" >&2
            exit 1
          fi
          if [ "$CONFIRM" != "publish" ]; then
            echo 'type "publish" in the confirm input to publish' >&2
            exit 1
          fi

  publish:
    name: publish
    needs: [guard]
    runs-on: ubuntu-26.04
    timeout-minutes: 120
    permissions:
      contents: read
      # Keyless signing: the manifest's certificate carries this workflow's
      # identity on main, which is what lock.json tells readers to require.
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@683b588c487a69d01f6c6ddf40f036ff682cc2c8 # v1
        with:
          toolchain: ${{ env.RUST_TOOLCHAIN }}
      - uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      # The distribution FFmpeg; test-corpus/toolchain.json names the major
      # version and encoders it must have, and generation checks them. The
      # exact version line goes into the provenance document.
      - name: Install the generator toolchain
        run: |
          set -eu
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends ffmpeg speex
          ffmpeg -hide_banner -version | head -n1
          speexenc --version | head -n1

      - name: Configuration is consistent
        run: |
          set -eu
          cargo xtask test-corpus expectations --check
          cargo xtask test-corpus ledger --check
          cargo xtask test-corpus verify

      # Every recipe, all profiles. --update-ledger records each file's size
      # and BLAKE3 in sources.json, in this runner's tree only.
      - name: Generate
        run: cargo xtask test-corpus generate --profile all --update-ledger

      - name: The generated tree is complete
        run: cargo xtask test-corpus verify --candidate

      - name: Report sizes
        run: |
          set -eu
          {
            echo "### Generated corpus"
            echo
            echo "| directory | files | bytes |"
            echo "| --- | ---: | ---: |"
            for dir in tests/media/*/; do
              name="$(basename "$dir")"
              files="$(find "$dir" -type f | wc -l)"
              bytes="$(du -sb "$dir" | cut -f1)"
              echo "| $name | $files | $bytes |"
            done
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Build, describe and sign the manifest
        run: |
          set -eu
          cargo xtask test-corpus build
          cargo xtask test-corpus provenance
          cargo xtask test-corpus sign
          cargo xtask test-corpus verify-signature \
            --manifest target/test-corpus/manifest.json \
            --bundle target/test-corpus/manifest.json.sigstore.json

      - name: Dry run
        if: ${{ inputs.dry_run }}
        run: cargo xtask test-corpus publish --r2 --dry-run --bucket "$R2_BUCKET_NAME" --public-url "$R2_PUBLIC_URL"
        env:
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_CORPUS_ACCESS_KEY: ${{ secrets.R2_CORPUS_ACCESS_KEY }}
          R2_CORPUS_ACCESS_SECRET: ${{ secrets.R2_CORPUS_ACCESS_SECRET }}
          R2_CORPUS_ENDPOINT: ${{ secrets.R2_CORPUS_ENDPOINT }}

      # Create-only uploads: an object already present is read back from the
      # public URL and checked against its digest, never overwritten.
      - name: Publish
        if: ${{ !inputs.dry_run }}
        run: cargo xtask test-corpus publish --r2 --write-lock --bucket "$R2_BUCKET_NAME" --public-url "$R2_PUBLIC_URL"
        env:
          R2_BUCKET_NAME: ${{ vars.R2_BUCKET_NAME }}
          R2_PUBLIC_URL: ${{ vars.R2_PUBLIC_URL }}
          R2_CORPUS_ACCESS_KEY: ${{ secrets.R2_CORPUS_ACCESS_KEY }}
          R2_CORPUS_ACCESS_SECRET: ${{ secrets.R2_CORPUS_ACCESS_SECRET }}
          R2_CORPUS_ENDPOINT: ${{ secrets.R2_CORPUS_ENDPOINT }}

      # The proof a reader runs: fetch the pinned revision back through the
      # public URL, check its signature, and hydrate every profile from it.
      - name: Read the published revision back
        if: ${{ !inputs.dry_run }}
        run: |
          set -eu
          cargo xtask test-corpus verify-signature
          cargo xtask test-corpus hydrate --profile all --root target/readback --verify-signature
          cargo xtask test-corpus verify --root target/readback --all-present

      - name: Hand the lock to a pull request
        if: ${{ !inputs.dry_run }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: test-corpus-lock
          path: |
            test-corpus/lock.json
            test-corpus/sources.json
            target/test-corpus/provenance.json
          if-no-files-found: error
