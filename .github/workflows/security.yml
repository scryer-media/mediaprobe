name: security

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '23 3 * * 1'

permissions:
  contents: read

jobs:
  cargo-audit:
    name: cargo-audit
    runs-on: ubuntu-26.04
    timeout-minutes: 15
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install cargo-audit
        uses: taiki-e/install-action@b6b84cf49ebfe0176417bdce007c624f0db37f20 # v2.86.2
        with:
          tool: cargo-audit@0.22.2

      # Three lockfiles: the crate, the fuzz harness and the repository
      # tooling. Each is its own workspace, so each is audited on its own.
      - name: Audit the crate's dependencies
        run: cargo audit --file Cargo.lock

      - name: Audit the fuzz harness's dependencies
        run: cargo audit --file fuzz/Cargo.lock

      - name: Audit the repository tooling's dependencies
        run: cargo audit --file xtask/Cargo.lock

  zizmor:
    name: zizmor
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    # zizmor reports in the job log and any finding fails the job, which
    # needs only read access.
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Audit workflows
        uses: zizmorcore/zizmor-action@3dc1ecc9bcb9e94e9b2c709687979e1298497054 # v0.6.2
        with:
          advanced-security: false
