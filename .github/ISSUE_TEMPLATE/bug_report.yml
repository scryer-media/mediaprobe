name: Bug report
description: Wrong or missing metadata, a panic, a crash or a build failure.
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: mediaprobe version
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: The container and codecs, the options used, what you expected and what you got. Include any panic message.
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Reproduction
      description: The file (or how it was generated) and the calls made. Never attach private data.
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform (OS, CPU, rustc version)
