[package]
name = "mediaprobe"
version = "0.1.0"
edition = "2024"
rust-version = "1.97.1"
authors = ["NZB Man"]
license = "Apache-2.0"
keywords = ["media", "video", "metadata", "container", "codec"]
categories = ["multimedia", "multimedia::video", "parser-implementations"]
repository = "https://github.com/scryer-media/mediaprobe"
description = "Container and stream metadata for media files, read in pure Rust with no external tools."
readme = "README.md"
# Repository scaffolding that has no business in the crate archive.
exclude = [
    ".agents/", ".githooks/", ".github/", ".gitleaks.toml", ".gitattributes", "renovate.json",
    "AGENTS.md", "tests/", "rust-toolchain.toml",
]

[dependencies]
serde = { version = "1.0.229", features = ["derive"] }

# The parser. Optional so that `default-features = false` leaves only the
# data types, which need serde alone.
bytes = { version = "1.12.1", optional = true }
isolang = { version = "2.4.0", optional = true }
mp4parse = { version = "0.17.0", optional = true }
ogg = { version = "0.9.2", optional = true }
riff = { version = "2.0.0", optional = true }
scuffle-h264 = { version = "0.2.2", optional = true }
scuffle-h265 = { version = "0.2.2", optional = true }
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"], optional = true }
thiserror = { version = "2.0.21", optional = true }

[features]
default = ["probe"]
# The parser and the probe entry points.
probe = [
    "dep:bytes", "dep:isolang", "dep:mp4parse", "dep:ogg", "dep:riff",
    "dep:scuffle-h264", "dep:scuffle-h265", "dep:serde_json", "dep:thiserror",
]
# Not for applications: exposes `mediaprobe::__fuzzing`, the internals the
# fuzz harness drives (the scanner differential). Its contents carry no
# stability promise.
fuzzing = ["probe"]

[dev-dependencies]
# The corpus harness under tests/: the expectations file is TOML, analyses
# are compared as JSON.
serde_json = { version = "1.0.154", features = ["float_roundtrip", "preserve_order"] }
toml = "1.2.1"

# The examples and the parser tests need the parser.
[[example]]
name = "probe"
required-features = ["probe"]

[[example]]
name = "diagnose"
required-features = ["probe"]

[[example]]
name = "ffprobe_audio_audit"
required-features = ["probe"]

[[example]]
name = "ffprobe_corpus_parity"
required-features = ["probe"]

[[example]]
name = "ffprobe_gutcheck"
required-features = ["probe"]

[[example]]
name = "generate_ogm_fixtures"
required-features = ["probe"]

[[example]]
name = "simple_raw_timings"
required-features = ["probe"]

# The scanner differential reaches the parser through `__fuzzing`.
[[test]]
name = "unsafe_scanners"
required-features = ["fuzzing"]

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
missing_docs = "warn"

[package.metadata.docs.rs]
rustdoc-args = ["--cfg", "docsrs"]
